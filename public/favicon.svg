<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="cielo" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0b1430"/>
      <stop offset="1" stop-color="#22417a"/>
    </linearGradient>
    <radialGradient id="globo" cx="0.38" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#4fd1c5"/>
      <stop offset="1" stop-color="#1b7f9c"/>
    </radialGradient>
    <clipPath id="recorte">
      <circle cx="240" cy="276" r="118"/>
