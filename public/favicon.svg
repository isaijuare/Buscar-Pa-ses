    <path d="M170 210 q30 -26 62 -6 q10 24 -16 38 q-20 8 -22 30 q-24 -6 -30 -30 q-6 -18 6 -32z"/>
    <path d="M262 290 q34 -10 54 12 q4 30 -26 46 q-22 6 -30 -16 q-8 -22 2 -42z"/>
  </g>
  <circle cx="240" cy="276" r="118" fill="none" stroke="#ffffff" stroke-opacity="0.35" stroke-width="4"/>
  <!-- Luna creciente -->
  <circle cx="352" cy="164" r="58" fill="#ffe9a8"/>
  <circle cx="378" cy="146" r="52" fill="#0f1c3e"/>
