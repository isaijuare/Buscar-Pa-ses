  </defs>
  <!-- Fondo completo (los íconos maskable se recortan en círculo o en gota) -->
  <rect width="512" height="512" fill="url(#cielo)"/>
  <!-- Estrellas -->
  <g fill="#ffffff">
    <circle cx="120" cy="130" r="4"/>
    <circle cx="170" cy="96" r="2.5"/>
    <circle cx="392" cy="372" r="3"/>
    <circle cx="140" cy="390" r="2.5"/>
    <circle cx="300" cy="120" r="2"/>
  </g>
  <!-- Globo terráqueo -->
  <circle cx="240" cy="276" r="118" fill="url(#globo)"/>
  <g clip-path="url(#recorte)" fill="none" stroke="#e8fbff" stroke-opacity="0.75" stroke-width="7">
    <ellipse cx="240" cy="276" rx="52" ry="118"/>
    <line x1="240" y1="150" x2="240" y2="402"/>
    <line x1="110" y1="276" x2="370" y2="276"/>
    <path d="M128 216 Q240 240 352 216"/>
    <path d="M128 336 Q240 312 352 336"/>
  </g>
