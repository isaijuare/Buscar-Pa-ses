<div class="pantalla-detalle">
  <button class="btn-volver" (click)="onCerrar()">
    ✕ Cerrar
  </button>

  @if (ubicacion(); as u) {
    @if (nombrePais()) {
      <h2 class="titulo">{{ nombrePais() }}</h2>
    }
    <app-tiempo-actual [ubicacion]="u" />
  } @else {
    <p class="error">Faltan coordenadas para consultar el clima.</p>
  }
</div>
