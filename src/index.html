<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Tu Clima</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Busca países y consulta su clima, la Luna, las estaciones, lugares turísticos y datos para viajar.">
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="icon" type="image/x-icon" href="favicon.ico" sizes="any">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;700&amp;display=swap" rel="stylesheet">
  <script>
    // Aplica el tema antes de pintar, para que no parpadee. En modo automático se estima si es de
    // noche con la hora local; el fondo del cielo lo corrige después con la posición real del Sol.
    try {
      var hora = new Date().getHours();
      var noche = hora < 6 || hora >= 18;
      document.documentElement.setAttribute('data-noche', noche ? 'si' : 'no');
      var modo = localStorage.getItem('buscador-paises:tema') || 'auto';
      document.documentElement.setAttribute('data-tema', modo === 'auto' ? (noche ? 'oscuro' : 'claro') : modo);
      // El sidebar se dibuja directamente cerrado si así lo dejó el usuario
      if (localStorage.getItem('buscador-paises:sidebar') === 'cerrado') {
        document.documentElement.setAttribute('data-sidebar', 'cerrado');
      }
    } catch (e) {}
  </script>
  <link rel="manifest" href="manifest.webmanifest">
  <meta name="theme-color" content="#1a1d21">
  <link rel="apple-touch-icon" href="icons/icon-192x192.png">
</head>
<body>
  <app-root></app-root>
  <noscript>Activa JavaScript para usar Tu Clima.</noscript>
</body>
</html>
